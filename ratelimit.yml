# Edit and restart to apply (restart resets all counters). Override path with RATELIMIT_FILE.
# per-minute = sustained refill rate; burst = bucket size (back-to-back requests after idle).
ratelimit:
  # false = shadow mode: log would-be rejections, block nothing. Try new limits this way first.
  enforce: true

  # ~160 bytes/bucket, so 100k ≈ 16 MB. At the cap, full buckets are evicted; if none,
  # requests needing a new bucket pass unlimited and log limiter_full.
  max-buckets: 100000

  default-tier: standard

  # Each request must pass both its org's total bucket and its per-endpoint read/write bucket.
  # GET/HEAD/OPTIONS are reads; everything else is a write.
  tiers:
    standard:
      total: { per-minute: 100, burst: 20 }
      read:  { per-minute: 60,  burst: 15 }
      write: { per-minute: 20,  burst: 5 }
    premium:
      total: { per-minute: 500, burst: 100 }
      read:  { per-minute: 300, burst: 75 }
      write: { per-minute: 100, burst: 20 }

  # total/read/write set here replace the tier's value.
  orgs:
    acme:   { tier: premium }
    globex: { tier: standard }
    initech:
      tier: standard
      write: { per-minute: 40, burst: 10 }

  # Per-endpoint limit for all orgs, replacing read/write. Path is the route template.
  route-overrides:
    - { method: POST, path: /exports, per-minute: 5, burst: 1 }

  # Stand-in for auth; real keys come from the auth layer. Keys sharing an org share its limits.
  api-keys:
    key-acme-1: acme
    key-acme-2: acme
    key-globex: globex
    key-initech: initech
